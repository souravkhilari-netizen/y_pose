<svg width="640" height="820" viewBox="0 0 640 820" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="640" height="820" rx="36" fill="#EAF4EC"/>
  <!-- Card -->
  <rect x="20" y="20" width="600" height="780" rx="28" fill="#FFFFFF" stroke="#C3DCC7" stroke-width="2"/>

  <!-- Shadow under standing foot -->
  <ellipse cx="325" cy="692" rx="40" ry="11" fill="#C9DFC9" opacity="0.6"/>

  <!-- === BODY (Tree Pose / Vrikshasana) === -->

  <!-- Standing foot (right) -->
  <ellipse cx="325" cy="685" rx="30" ry="10" fill="#C8956C"/>

  <!-- Standing lower leg (right) -->
  <rect x="311" y="580" width="28" height="108" rx="14" fill="#D9A97C"/>
  <!-- Standing knee -->
  <circle cx="325" cy="580" r="16" fill="#C8956C"/>
  <!-- Standing upper leg (right) -->
  <rect x="311" y="470" width="28" height="120" rx="14" fill="#4A7C59"/>

  <!-- Bent leg (left) - raised and rotated outward -->
  <!-- Left thigh going diagonally out-left from hip -->
  <line x1="305" y1="490" x2="236" y2="564" stroke="#4A7C59" stroke-width="28" stroke-linecap="round"/>
  <!-- Left shin going down from knee to rest on right leg -->
  <line x1="236" y1="564" x2="284" y2="620" stroke="#D9A97C" stroke-width="24" stroke-linecap="round"/>
  <!-- Left foot resting on right inner thigh -->
  <ellipse cx="296" cy="628" rx="22" ry="9" fill="#C8956C" transform="rotate(-30 296 628)"/>

  <!-- Hips block -->
  <rect x="295" y="458" width="80" height="38" rx="18" fill="#3A6B4A"/>

  <!-- Torso -->
  <rect x="296" y="300" width="68" height="168" rx="22" fill="#4A7C59"/>

  <!-- === ARMS raised overhead in prayer / Namaste === -->
  <!-- Left upper arm going up-left -->
  <line x1="296" y1="320" x2="230" y2="230" stroke="#4A7C59" stroke-width="26" stroke-linecap="round"/>
  <!-- Right upper arm going up-right -->
  <line x1="364" y1="320" x2="410" y2="230" stroke="#4A7C59" stroke-width="26" stroke-linecap="round"/>
  <!-- Left forearm -->
  <line x1="230" y1="230" x2="310" y2="168" stroke="#D9A97C" stroke-width="22" stroke-linecap="round"/>
  <!-- Right forearm -->
  <line x1="410" y1="230" x2="330" y2="168" stroke="#D9A97C" stroke-width="22" stroke-linecap="round"/>
  <!-- Prayer hands joined -->
  <ellipse cx="320" cy="162" rx="22" ry="16" fill="#C8956C"/>
  <!-- Finger details -->
  <line x1="310" y1="150" x2="310" y2="146" stroke="#B07050" stroke-width="3" stroke-linecap="round"/>
  <line x1="318" y1="147" x2="318" y2="143" stroke="#B07050" stroke-width="3" stroke-linecap="round"/>
  <line x1="326" y1="147" x2="326" y2="143" stroke="#B07050" stroke-width="3" stroke-linecap="round"/>
  <line x1="333" y1="150" x2="333" y2="146" stroke="#B07050" stroke-width="3" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="314" y="268" width="24" height="42" rx="12" fill="#D9A97C"/>

  <!-- Head -->
  <ellipse cx="326" cy="236" rx="46" ry="54" fill="#D9A97C"/>

  <!-- Face details -->
  <!-- Hair -->
  <ellipse cx="326" cy="193" rx="46" ry="22" fill="#4A2C0A"/>
  <rect x="280" y="193" width="92" height="20" rx="0" fill="#4A2C0A"/>
  <!-- Eyes (closed / peaceful) -->
  <path d="M310 236 Q317 230 324 236" stroke="#4A2C0A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M330 236 Q337 230 344 236" stroke="#4A2C0A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M322 250 Q326 258 330 250" stroke="#B07050" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M314 266 Q326 276 338 266" stroke="#B07050" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- === GROUND LINE === -->
  <line x1="200" y1="695" x2="440" y2="695" stroke="#A8C8AA" stroke-width="3" stroke-linecap="round"/>

  <!-- === Label === -->
  <rect x="160" y="726" width="320" height="56" rx="16" fill="#3A6B4A"/>
  <text x="320" y="750" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="22" font-weight="700">Tree Pose</text>
  <text x="320" y="772" text-anchor="middle" fill="#C3E6C7" font-family="Arial, sans-serif" font-size="15">Vrikshasana • Balance on one leg</text>
</svg>
